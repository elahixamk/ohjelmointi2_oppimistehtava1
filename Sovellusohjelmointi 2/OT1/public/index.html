<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Tilaa uutiskirje</title>
    <style>
        body {
            padding-top: 50px;
        }
    </style>
</head>
<body>
  <div class="container">
    <form method="GET" action="/lomake">
      <h1 class="display-5 mb-3">Tilaa uutiskirje</h1>

      <div class="row mb-3">
        <div class="col">
          <input type="text" class="form-control" name="etunimi" placeholder="Etunimi">
        </div>
        <div class="col">
          <input type="text" class="form-control" name="sukunimi" placeholder="Sukunimi">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col">
          <input type="text" class="form-control" name="email" placeholder="Sähköpostiosoite">
        </div>
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" value="hyvaksytty" name="kayttoehdot" id="kayttoehdot">
        <label class="form-check-label" for="kayttoehdot">Olen lukenut ja hyväksyn käyttöehdot</label>
      </div>

      <div class="row mb-3">
        <div class="col-sm-5">
          <button type="submit" class="btn btn-primary">Lähetä tiedot</button>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
